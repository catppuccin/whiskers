name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build & Upload Site
        uses: withastro/action@v6
        with:
          path: ./docs
          package-manager: pnpm@10.14.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # only deploy from main, don't run on forks
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'catppuccin/whiskers' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
